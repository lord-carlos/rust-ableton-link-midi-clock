[package]
name = "rust-ableton-link-midi-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.37"
midir = "0.11"
ableton-link-rs = { version = "0.1.2", default-features = false }
tokio = { version = "1", features = ["full"] }
tray-icon = "0.26"
crossbeam-channel = "0.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.21"
ctrlc = "3.5"
winit = "0.30" # Ensure version matches eframe's winit dependency

[profile.release]
strip = "symbols"
lto = "fat"
codegen-units = 1

[patch.crates-io]
ableton-link-rs = { path = "deps/ableton-link-rs" }
# Replacement for the local-ip-address crate used by ableton-link-rs:
# skips loopback, 169.254.x.x (APIPA on disconnected virtual adapters), and
# any address that fails a live UDP bind test, so "pick the first non-loopback
# IPv4 and bind" logic in the crate no longer panics (WSAEADDRNOTAVAIL).
local-ip-address = { path = "deps/local-ip-address-shim" }
