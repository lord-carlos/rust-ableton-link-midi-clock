[package]
name = "rust-ableton-link-midi-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
midir = "0.10.3"
ableton-link-rs = { version = "0.1.2", default-features = false }
tokio = { version = "1", features = ["full"] }
tray-icon = "0.19"
crossbeam-channel = "0.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
once_cell = "1.20"
ctrlc = "3.2"
winit = "0.29" # Ensure version matches eframe's winit dependency if possible, or rely on eframe's re-export

[patch.crates-io]
ableton-link-rs = { path = "deps/ableton-link-rs" }
