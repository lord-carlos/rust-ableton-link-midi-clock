[package]
name = "rust-ableton-link-midi-clock"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.37"
egui = "0.37"
midir = "0.11"
ableton-link-rs = { version = "0.1.2", default-features = false }
tokio = { version = "1", features = ["full"] }
tray-icon = "0.26"
crossbeam-channel = "0.5"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
once_cell = "1.21"
ctrlc = "3.5"
winit = "0.30" # Ensure version matches eframe's winit dependency

[patch.crates-io]
ableton-link-rs = { path = "deps/ableton-link-rs" }
